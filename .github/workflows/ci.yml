name: CI

on:
  push:
    branches: [main, audit-fixes-and-refactor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Repo standardizes on bun as the package manager (audit F-09).
        # bun.lock is the canonical lockfile; package-lock.json is gitignored.
        run: bun install --frozen-lockfile

      - name: Syntax check
        run: npm run syntax

      - name: Lint
        run: npm run lint
        continue-on-error: true  # lint currently has issues; don't block CI

      - name: Run unit tests (node:test)
        run: npm test
        env:
          NODE_ENV: test
          # node:test DB-backed suites skip when DATABASE_URL points at a
          # non-existent server, so this URL is intentionally unreachable.
          # The integration-test job below spins up a real Postgres for
          # the Jest + supertest suite.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
          SESSION_SECRET: ci-test-secret
          CSRF_SECRET: ci-test-csrf-secret

  integration-test:
    name: Integration tests (Jest + supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssewasswa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # bun install must succeed so jest + supertest are available.
        # bun.lock is kept in sync with package.json devDependencies.
        run: bun install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
          echo "Postgres did not become ready in 30s" >&2
          exit 1

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssewasswa_test
        run: npm run migrate

      - name: Run Jest integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssewasswa_test
          NODE_ENV: test
          SESSION_SECRET: ci-test-secret
          CSRF_SECRET: ci-test-csrf-secret
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: npm run test:jest
