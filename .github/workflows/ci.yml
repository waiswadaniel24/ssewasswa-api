name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: node -c server.js
      - run: node -c config.js
      - run: node -c middleware.js
      - run: node -c jwt-auth.js
      - run: node -c db.js
      - run: node -c migration-queue.js
      - name: Check all module syntax
        run: |
          for f in *.js; do
            node -c "$f" 2>&1 || echo "FAIL: $f"
          done

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to Render
    needs: syntax
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/deploy/srv-d7vjts50lvsc73fun8f0?key=3t2h6r19cZo"
