plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.comfortzone.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.comfortzone.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        // The PWA URL this TWA wraps
        buildConfigField "String", "LAUNCH_URL", '"https://ssewasswa.onrender.com"'
        buildConfigField "String", "HOST_NAME", '"ssewasswa.onrender.com"'
        buildConfigField "String", "ASSETLINKS_URL", '"https://ssewasswa.onrender.com/.well-known/assetlinks.json"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // For signed release, create a keystore and add signing config:
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // AndroidX Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Chrome Custom Tabs / Trusted Web Activity Support
    implementation "androidx.browser:browser:1.7.0"

    // SplashScreen API for modern splash screen handling
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Lifecycle components for TWA lifecycle management
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
