# ssewasswa-api — Nginx reverse proxy configuration
#
# This config is for self-hosted deployments (e.g., on a VPS with Docker, or on AWS EC2).
# For Render deployments, Render handles TLS and routing — this file is documentation.
#
# Features:
#   - Custom domain routing (tenant resolves via Host header in branding-currency.js)
#   - TLS termination with Let's Encrypt (auto-renew via certbot)
#   - Rate limiting on /public/* endpoints (defense layer in front of app-level rate limiting)
#   - WebSocket proxying for real-time notifications
#   - Gzip compression
#   - Security headers (in addition to helmet in the app)
#   - Static asset caching
#
# See nginx/README.md for setup instructions and docs/RATE_LIMITING.md for the
# three-layer rate-limiting strategy (Cloudflare → Nginx → app-level).

# Upstream definition — the Node.js app server.
# Adjust the host/port to match your deployment (default: 127.0.0.1:3000).
upstream ssewasswa_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones — keyed by client IP ($binary_remote_addr is the binary
# form, which uses less memory than the ASCII form).
limit_req_zone $binary_remote_addr zone=public_verify:10m rate=10r/m;  # /public/verify: 10 req/min per IP
limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;     # /api/public/*: 60 req/min per IP
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;           # /api/auth/login: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;           # general API: 100 req/min per IP

# HTTP → HTTPS redirect.
# Catches all requests on port 80 (including custom client domains) and
# redirects them to HTTPS on the same host.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server (wildcard SNI — handles all custom domains).
# The app resolves the tenant from the Host header via the
# resolveTenantDomain middleware in branding-currency.js, so Nginx does not
# need to know about individual custom domains — it accepts all of them.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # wildcard — the app resolves the tenant from the Host header

    # TLS certificates (Let's Encrypt via certbot).
    # For wildcard certs, use DNS-01 challenge. For per-domain, use HTTP-01.
    # Example for a specific custom domain:
    # ssl_certificate /etc/letsencrypt/live/ssewasswa.onrender.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ssewasswa.onrender.com/privkey.pem;
    #
    # For wildcard: use certbot with --manual --preferred-challenges dns
    # ssl_certificate /etc/letsencrypt/live/*.ssewasswa.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/*.ssewasswa.com/privkey.pem;

    # TLS settings (Mozilla intermediate compatibility — https://ssl-config.mozilla.org/)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — once a browser has seen this, it will refuse plain HTTP for the
    # next 6 months (includeSubDomains covers custom client domains).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Security headers (in addition to helmet in the app).
    # `always` ensures they are sent on error responses too.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip — compress JSON/HTML/CSS/JS responses >1KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client body size limit — for file uploads (certificate images, CSV imports, etc.).
    # Increase if you accept larger uploads.
    client_max_body_size 10M;

    # === Rate-limited public verification endpoints ===
    # /public/verify/* — certificate verification (very strict: 10 req/min per IP).
    # This is the HTML UI; the JSON API mirror is at /api/public/verify/* (below).
    location ~ ^/public/verify {
        limit_req zone=public_verify burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/public/* — public JSON API (60 req/min per IP).
    # Covers /api/public/verify/:certCode (added by Track C) plus future
    # public endpoints (events, news, campaigns).
    location ~ ^/api/public/ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/auth/login — strict rate limit (5 req/min per IP) for brute-force protection.
    location ~ ^/api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === WebSocket endpoint (for real-time notifications) ===
    # The app exposes /ws for live updates (announcements, fee payments, chat).
    # The Upgrade/Connection headers are required for the WebSocket handshake.
    location /ws {
        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket keepalive — keep the connection open for up to 24h.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # === Stripe webhook (no rate limit — Stripe retries on 429) ===
    # `proxy_request_buffering off` is critical: Stripe signature verification
    # requires the unmodified raw body; if Nginx buffers it, the app may see a
    # re-chunked body that fails signature verification.
    location = /api/payments/stripe/webhook {
        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # === PayPal webhook (no rate limit) ===
    location = /api/payments/paypal/webhook {
        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === General API (100 req/min per IP) ===
    # All other /api/* paths (authenticated CRUD, dashboard, sync, etc.).
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Static assets (long cache) ===
    # Icons, fonts, CSS, JS bundles. 1h cache is conservative — bump to 30d
    # with `immutable` once you implement cache-busting filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # === Everything else (homepage, /docs/*, etc.) ===
    # No rate limit on HTML pages — the app already rate-limits /login and
    # /register separately (see server.js lines 867-868).
    location / {
        proxy_pass http://ssewasswa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
