<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSEWASSWA v9.0 - School OS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui;background:linear-gradient(135deg,#1e40af,#3b82f6);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .hero{text-align:center;padding:40px;max-width:600px}
    h1{font-size:48px;margin-bottom:20px}
    .btn{background:white;color:#1e40af;border:none;border-radius:12px;padding:16px 32px;font-size:18px;font-weight:600;text-decoration:none;display:inline-block;margin:10px;cursor:pointer}
    .stats{display:flex;gap:30px;justify-content:center;margin:30px 0;flex-wrap:wrap}
    .stat{text-align:center}
    .num{font-size:36px;font-weight:bold}
  </style>
</head>
<body>
  <div class="hero">
    <h1>🏫 SSEWASSWA v9.0</h1>
    <p style="font-size:20px;margin-bottom:30px">Run your school on your phone. Marks, fees, SMS to parents.</p>
    <div class="stats">
      <div class="stat"><div class="num" id="schools">0</div><div>Schools</div></div>
      <div class="stat"><div class="num" id="students">0</div><div>Students</div></div>
      <div class="stat"><div class="num" id="donations">0</div><div>UGX Donated</div></div>
    </div>
    <a href="/login" class="btn">Login</a>
    <a href="/register" class="btn">Start Free Trial</a>
    <p style="margin-top:30px;font-size:14px;opacity:0.8">v9.0 - Redis Sessions, Workers, API v2</p>
  </div>
  <script>
    fetch('/api/stats').then(r=>r.json()).then(d=>{
      document.getElementById('schools').textContent = d.schools;
      document.getElementById('students').textContent = d.students;
      document.getElementById('donations').textContent = (d.donations/1000000).toFixed(1)+'M';
    });
  </script>
</body>
</html>
