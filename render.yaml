services:
    - type: web
    name: ssewasswa-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
            - key: NODE_ENV
        value: production
            - key: DATABASE_URL
        fromDatabase:
          name: ssewasswa-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          name: ssewasswa-redis
          type: redis
          property: connectionString
            - key: SESSION_SECRET
        generateValue: true
            - key: ENCRYPTION_SECRET
        generateValue: true
  
    - type: worker
    name: ssewasswa-worker
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
            - key: DATABASE_URL
        fromDatabase:
          name: ssewasswa-db
          property: connectionString
            - key: REDIS_URL
        fromService:
          name: ssewasswa-redis
          type: redis
          property: connectionString

databases:
    - name: ssewasswa-db
    plan: free

services:
    - type: redis
    name: ssewasswa-redis
    plan: free
