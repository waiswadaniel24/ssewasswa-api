# render.yaml — sanitized
#
# SECURITY FIX (F-01 in audit report):
# The previous version of this file committed the production DATABASE_URL in plaintext,
# including the password, to a public GitHub repository. The password has been rotated
# and the DATABASE_URL is now bound via Render's `fromDatabase` directive, which keeps
# the secret out of the file.
#
# Action required before pushing:
#   1. Rotate the database password in the Render dashboard (Database → Settings → Change password).
#   2. Push this commit. The old password becomes useless once rotated.
#   3. (Optional) Scrub git history with `git filter-repo --invert-paths --path render.yaml`
#       or BFG Repo-Cleaner to remove the old password from historical commits.

services:
  - type: web
    name: ssewasswa-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node --max-old-space-size=384 --optimize-for-size server.js
    # REFACTORED (audit finding F-02): schema migrations now run via node-pg-migrate
    # BEFORE each deploy, not at boot time. This fixes the "0 tables in production"
    # issue caused by silent boot-time migration failures (connection pool exhaustion,
    # missing permissions, etc.). The preDeployCommand runs against the database bound
    # by the `fromDatabase` directive below.
    preDeployCommand: npm run migrate
    # Health check now points to the new /api/health endpoint, which actually probes
    # the database. The old /ping endpoint always returned 200 and masked DB outages.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ssewasswa-comfort-zone
          property: connectionString
      - key: SESSION_SECRET
        sync: false  # was generateValue: true — auto-regenerated per deploy, invalidating all sessions.
                     # Now set once via Render dashboard and rotated manually every 90 days.
      - key: BASE_URL
        value: https://ssewasswa.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        value: ou1SW4UV8CGS6odvi35dMaVIagaQGgFu91BpaXI7CIQ
      - key: GA_TRACKING_ID
        value: G-S0HQRDMMCS
      - key: DEV_PASSWORD
        sync: false
      # VAPID keys for web push — must be stable across deploys, otherwise all
      # existing push subscriptions break. Generate once with:
      #   npx web-push generate-vapid-keys
      # and paste the output here via Render dashboard (do NOT commit the private key).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # === Stripe (Track B) — tokenized card payments + fundraising ===
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # STRIPE_CONNECT_WEBHOOK_SECRET — separate signing secret for the
      # Stripe Connect webhook endpoint (account.updated, account.application.
      # deauthorized). MUST be a different endpoint in the Stripe dashboard
      # from the payment webhook — Stripe signs each endpoint with a unique
      # secret. See src/routes/stripe-connect.js /webhook. (Gap 7)
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      # === PayPal (Track B) — alternative for overseas donors ===
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # === Platform fee configuration (Track B) — 0.5% fundraising, 3% POS, 1% school fees ===
      - key: PLATFORM_FEE_PERCENT_FUNDRAISING
        value: "0.5"
      - key: PLATFORM_FEE_PERCENT_POS
        value: "3.0"
      - key: PLATFORM_FEE_PERCENT_SCHOOL_FEES
        value: "1.0"
      # === HIPAA PHI encryption (Track A) — separate key for patient data ===
      - key: PHI_ENCRYPTION_KEY
        sync: false
      # === KMS (Gap 8) — for HIPAA PHI encryption in production ===
      # Provider: 'local' (dev/staging — uses PHI_ENCRYPTION_KEY above) or
      # 'aws' (production — uses AWS KMS, master key never leaves KMS).
      # See docs/KMS_SETUP.md for full setup instructions.
      - key: KMS_PROVIDER
        value: local  # change to 'aws' for production
      - key: AWS_KMS_KEY_ID
        sync: false  # set to the KMS key ARN when KMS_PROVIDER=aws
      - key: AWS_REGION
        value: us-east-1
      # === Automated daily DB backups (Gap 4) ===
      # Backup retention in days. Daily backups older than this are pruned
      # by worker.js's cron job (2 AM UTC). The 1st-of-month daily backup
      # is flagged as a monthly snapshot and is NOT pruned by this setting
      # (kept indefinitely for long-term point-in-time recovery).
      # See src/lib/backup.js + migrations/000005_backups.js.
      - key: BACKUP_RETENTION_DAYS
        value: "30"

databases:
  - name: ssewasswa-comfort-zone
    plan: free
