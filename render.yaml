services:
  - type: web
    name: ssewasswa-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ssewasswa-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: ssewasswa-db
    plan: free
